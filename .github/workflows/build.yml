name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/doubao-monet.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/doubao-monet.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${STOREPASS:-android}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS_VALUE:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEYPASS:-${STOREPASS:-android}}" >> "$GITHUB_ENV"
            echo "FIXED_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "FIXED_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Doubao_Monet
          path: build/out/Doubao_Monet.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.FIXED_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/Doubao_Monet.apk
          generate_release_notes: true
