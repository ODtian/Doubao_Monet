name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/doubao-monet.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/doubao-monet.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${STOREPASS:-android}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS_VALUE:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEYPASS:-${STOREPASS:-android}}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: bash scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doubao_Monet
          path: build/out/Doubao_Monet.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/Doubao_Monet.apk
          generate_release_notes: true
